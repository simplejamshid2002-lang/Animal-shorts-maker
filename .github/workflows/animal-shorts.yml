
name: Animal Shorts Downloader
permissions:
  contents: write
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  download-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      
      - name: Save downloaded videos
        run: |
          if [ -d output ] && [ "$(find output -type f | wc -l)" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add output/
            git diff --cached --quiet || git commit -m "Add downloaded animal videos"
            git pull --rebase origin main
            git push origin main
          fi
